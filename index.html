<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3a84" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RCSQ M10" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>RCSQ M10 Coach</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand-line">
      <img src="assets/rcsq-logo.png" alt="Logo RCSQ" class="mini-logo" />
      <div>
        <div class="eyebrow">RCSQ • M10 • Saison 2026-2027</div>
        <h1 id="pageTitle">Accueil</h1>
      </div>
    </div>
    <button id="quickCoachBtn" class="icon-btn" aria-label="Paroles coach">🎤</button>
  </header>

  <main id="content" class="content"></main>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <button data-route="home" class="nav-item active"><span>⌂</span><small>Accueil</small></button>
    <button data-route="squad" class="nav-item"><span>👥</span><small>Effectif</small></button>
    <button data-route="match" class="nav-item"><span>🏉</span><small>Match</small></button>
    <button data-route="training" class="nav-item"><span>📋</span><small>Entraînement</small></button>
    <button data-route="stats" class="nav-item"><span>📊</span><small>Stats</small></button>
  </nav>

  <div id="toast" class="toast" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-sheet" role="dialog" aria-modal="true">
      <div class="modal-handle"></div>
      <div id="modalContent"></div>
    </section>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
